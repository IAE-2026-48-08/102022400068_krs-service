services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: krs_service_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www
      - /var/www/vendor
    environment:
      - APP_ENV=local
      - DB_CONNECTION=mysql
      - DB_HOST=mysql_krs_container
      - DB_PORT=3306
      - DB_DATABASE=krs_db
      - DB_USERNAME=root
      - DB_PASSWORD=
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    container_name: mysql_krs_container
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: krs_db
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    volumes:
      - krs_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  krs_db_data:
